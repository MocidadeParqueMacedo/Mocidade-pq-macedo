name: Notificacoes de Eventos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencias
        run: pip install pywebpush requests --quiet

      - name: Enviar notificacoes
        shell: python3 {0}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          import os, json, requests
          from datetime import datetime, timedelta
          from pywebpush import webpush, WebPushException

          amanha = (datetime.utcnow() + timedelta(days=1)).strftime('%Y-%m-%d')
          print('Verificando eventos para:', amanha)

          url = 'https://mocidade-parque-macedo-default-rtdb.firebaseio.com'

          # Le eventos
          evs_raw = requests.get(f'{url}/app/events.json').json()
          if not evs_raw:
            print('Nenhum evento.'); exit()
          evs = [e for e in (evs_raw.values() if isinstance(evs_raw,dict) else []) if e and e.get('data')==amanha]
          if not evs:
            print('Nenhum evento amanha.'); exit()
          print(f'{len(evs)} evento(s).')

          # Le dispositivos (subscricoes Web Push)
          disp_raw = requests.get(f'{url}/dispositivos.json').json()
          if not disp_raw:
            print('Nenhum dispositivo.'); exit()
          dispositivos = [d for d in disp_raw.values() if d and d.get('endpoint')]
          print(f'{len(dispositivos)} dispositivo(s).')

          vapid_private = os.environ.get('VAPID_PRIVATE_KEY','')

          for ev in evs:
            corpo = ev.get('titulo','') + (f" às {ev['horario']}" if ev.get('horario') else '') + (f" — {ev['local']}" if ev.get('local') else '')
            payload = json.dumps({'title':'📅 Evento amanhã — Reunião de Jovens','body':corpo,'tag':f"evento-{ev.get('id',0)}"})

            for d in dispositivos:
              try:
                webpush(
                  subscription_info={'endpoint':d['endpoint'],'keys':{'p256dh':d.get('p256dh',''),'auth':d.get('auth','')}},
                  data=payload,
                  vapid_private_key=vapid_private,
                  vapid_claims={'sub':'mailto:rdj.parquemacedo@gmail.com'}
                )
                print('✅ Enviado para', d['endpoint'][:40])
              except WebPushException as ex:
                print('⚠️ Falha:', ex)
          print('Concluido!')
