name: Notificacoes de Eventos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'   # 8h da manhã (Brasília = 11h UTC)

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar
        run: pip install pywebpush requests --quiet

      - name: Enviar
        shell: python3 {0}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          import os, json, requests
          from datetime import datetime, timedelta, timezone
          from pywebpush import webpush, WebPushException

          PRIVATE = os.environ['VAPID_PRIVATE_KEY']
          CLAIMS  = {'sub': 'mailto:rdj.parquemacedo@gmail.com'}
          DB      = 'https://mocidade-parque-macedo-default-rtdb.firebaseio.com'

          agora_br  = datetime.now(timezone.utc) + timedelta(hours=-3)
          hoje      = agora_br.strftime('%Y-%m-%d')
          amanha    = (agora_br + timedelta(days=1)).strftime('%Y-%m-%d')
          em7dias   = (agora_br + timedelta(days=7)).strftime('%Y-%m-%d')
          hoje_md   = agora_br.strftime('%m-%d')
          amanha_md = (agora_br + timedelta(days=1)).strftime('%m-%d')

          print(f'Hoje: {hoje} | Amanhã: {amanha} | Em 7 dias: {em7dias}')

          # ── Busca dispositivos ───────────────────────────────────────────────
          raw_d = requests.get(f'{DB}/dispositivos.json').json()
          if not raw_d: print('Sem dispositivos.'); exit()
          disps = list(raw_d.values()) if isinstance(raw_d,dict) else [d for d in raw_d if d]
          disps = [d for d in disps if d and d.get('endpoint') and d.get('p256dh')]
          print(f'Dispositivos: {len(disps)}')
          if not disps: exit()

          endpoints_mortos = []

          def enviar_push(titulo, corpo, tag):
            payload = json.dumps({'title': titulo, 'body': corpo, 'tag': tag})
            print(f'[{tag}] {titulo}: {corpo}')
            for d in disps:
              try:
                webpush(
                  subscription_info={'endpoint':d['endpoint'],'keys':{'p256dh':d.get('p256dh',''),'auth':d.get('auth','')}},
                  data=payload, vapid_private_key=PRIVATE, vapid_claims=CLAIMS
                )
                print('  OK')
              except WebPushException as ex:
                msg = str(ex)
                if '410' in msg or '404' in msg:
                  endpoints_mortos.append(d['endpoint'])
                else:
                  print('  Falha:', msg[:60])

          # ── EVENTOS ──────────────────────────────────────────────────────────
          raw_e = requests.get(f'{DB}/app/events.json').json()
          if raw_e:
            todos_ev = list(raw_e.values()) if isinstance(raw_e,dict) else [e for e in raw_e if e]
            for ev in todos_ev:
              if not ev: continue
              data_ev = ev.get('data','')
              corpo   = ev.get('titulo','') + (f" às {ev['horario']}" if ev.get('horario') else '') + (f" — {ev['local']}" if ev.get('local') else '')
              if data_ev == amanha:
                enviar_push('📅 Evento amanhã!', corpo, f"ev-{ev.get('id',0)}-1d")
              elif data_ev == em7dias:
                enviar_push('📅 Evento em 1 semana!', corpo, f"ev-{ev.get('id',0)}-7d")

          # ── VISITAS LOCAIS ───────────────────────────────────────────────────
          raw_v = requests.get(f'{DB}/app/visitas.json').json()
          if raw_v:
            visitas = list(raw_v.values()) if isinstance(raw_v,dict) else [v for v in raw_v if v]
            for v in visitas:
              if not v or v.get('data') != amanha: continue
              nome_v  = v.get('nome','')
              horario = f" às {v['horario']}" if v.get('horario') else ''
              end     = f" — {v['endereco']}" if v.get('endereco') else ''
              corpo   = f"Visita na casa de {nome_v}{horario}{end}"
              enviar_push('🏠 Visita amanhã!', corpo, f"visita-{v.get('id',nome_v)}-1d")

          # ── ANIVERSÁRIOS ─────────────────────────────────────────────────────
          raw_m = requests.get(f'{DB}/app/members.json').json()
          if raw_m:
            membros = list(raw_m.values()) if isinstance(raw_m,dict) else [m for m in raw_m if m]
            for m in membros:
              if not m or not m.get('nome') or not m.get('nascimento'): continue
              nasc = m['nascimento']
              try:
                if '-' in nasc:
                  parts = nasc.split('-')
                  nasc_md  = f"{parts[1]}-{parts[2]}"
                  ano_nasc = int(parts[0])
                else:
                  parts = nasc.split('/')
                  nasc_md  = f"{parts[1]}-{parts[0]}"
                  ano_nasc = int(parts[2])
              except:
                continue
              nome  = m['nome'].split()[0]
              idade = agora_br.year - ano_nasc
              if nasc_md == amanha_md:
                enviar_push(
                  '🎂 Aniversário amanhã!',
                  f'Amanhã {nome} completa {idade} anos! Não se esqueça de dar os parabéns! 🎉',
                  f'aniv-{m.get("id",nome)}-amanha'
                )
              elif nasc_md == hoje_md:
                enviar_push(
                  '🎉 Feliz Aniversário!',
                  f'Hoje {nome} completa {idade} anos! Não se esqueça de dar os parabéns! 🥳',
                  f'aniv-{m.get("id",nome)}-hoje'
                )

          # ── Remove subscriptions expiradas ───────────────────────────────────
          if endpoints_mortos:
            raw3 = requests.get(f'{DB}/dispositivos.json').json() or {}
            for k, v in (raw3.items() if isinstance(raw3,dict) else []):
              if v and v.get('endpoint') in endpoints_mortos:
                requests.delete(f'{DB}/dispositivos/{k}.json')
                print('Subscription expirada removida:', k[:20])

          print('Concluído!')
