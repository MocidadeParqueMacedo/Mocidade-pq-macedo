name: Notificacoes de Eventos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar
        run: pip install pywebpush requests --quiet

      - name: Executar
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          echo "" | base64 -d > /tmp/notif.py
          python3 /tmp/notif.py
