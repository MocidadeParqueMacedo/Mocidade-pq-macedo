name: Notificacoes de Eventos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar
        run: pip install pywebpush requests --quiet

      - name: Enviar
        shell: python3 {0}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          import os, json, requests
          from datetime import datetime, timedelta, timezone
          from pywebpush import webpush, WebPushException

          VAPID_PRIVATE = os.environ['VAPID_PRIVATE_KEY']
          VAPID_CLAIMS  = {'sub': 'mailto:rdj.parquemacedo@gmail.com'}
          DB = 'https://mocidade-parque-macedo-default-rtdb.firebaseio.com'

          amanha = (datetime.now(timezone.utc) + timedelta(days=1)).strftime('%Y-%m-%d')
          print('Amanha:', amanha)

          # Le eventos — trata array E objeto
          raw = requests.get(f'{DB}/app/events.json').json()
          if not raw:
            print('Nenhum evento cadastrado.'); exit()
          if isinstance(raw, list):
            todos = [e for e in raw if e]
          elif isinstance(raw, dict):
            todos = [e for e in raw.values() if e]
          else:
            todos = []

          evs = [e for e in todos if e.get('data') == amanha]
          print(f'Total eventos: {len(todos)} | Amanha: {len(evs)}')
          if not evs:
            print('Nenhum evento amanha.'); exit()

          # Le dispositivos — trata array E objeto
          raw2 = requests.get(f'{DB}/dispositivos.json').json()
          if not raw2:
            print('Nenhum dispositivo cadastrado.'); exit()
          if isinstance(raw2, list):
            disps = [d for d in raw2 if d and d.get('endpoint')]
          elif isinstance(raw2, dict):
            disps = [d for d in raw2.values() if d and d.get('endpoint')]
          else:
            disps = []

          print(f'{len(disps)} dispositivo(s).')
          if not disps: exit()

          for ev in evs:
            corpo = ev.get('titulo','') + (f" as {ev['horario']}" if ev.get('horario') else '') + (f" - {ev['local']}" if ev.get('local') else '')
            payload = json.dumps({'title':'Evento amanha!','body':corpo,'tag':f"ev-{ev.get('id',0)}"})
            print(f'Enviando: {corpo}')
            for d in disps:
              try:
                webpush(
                  subscription_info={'endpoint':d['endpoint'],'keys':{'p256dh':d.get('p256dh',''),'auth':d.get('auth','')}},
                  data=payload, vapid_private_key=VAPID_PRIVATE, vapid_claims=VAPID_CLAIMS
                )
                print('OK')
              except WebPushException as ex:
                print('Falha:', str(ex)[:100])
          print('Concluido!')
