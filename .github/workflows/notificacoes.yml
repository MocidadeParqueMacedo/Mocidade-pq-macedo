name: Notificacoes de Eventos

on:
  workflow_dispatch:
  # Desativado: o envio diário agora é feito pelo Supabase (pg_cron às 8h em ponto +
  # função supabase/functions/notificacoes). Este workflow ficou só para disparo manual
  # de emergência pela aba Actions.

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar
        run: pip install pywebpush requests --quiet

      - name: Executar
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          echo "" | base64 -d > /tmp/notif.py
          python3 /tmp/notif.py
