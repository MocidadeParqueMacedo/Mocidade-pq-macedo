name: Notificacoes de Eventos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar
        run: pip install firebase-admin --quiet

      - name: Rodar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta
          import firebase_admin
          from firebase_admin import credentials, db, messaging

          sa = json.loads(os.environ['SA'])
          firebase_admin.initialize_app(credentials.Certificate(sa), {'databaseURL': 'https://mocidade-parque-macedo-default-rtdb.firebaseio.com'})

          amanha = (datetime.utcnow() + timedelta(days=1)).strftime('%Y-%m-%d')
          print('Amanha:', amanha)

          evs_raw = db.reference('app/events').get() or {}
          evs = [e for e in (evs_raw.values() if isinstance(evs_raw, dict) else []) if e and e.get('data') == amanha]
          print('Eventos:', len(evs))
          if not evs: exit()

          disp = db.reference('dispositivos').get() or {}
          tokens = [d['token'] for d in (disp.values() if isinstance(disp, dict) else []) if d and d.get('token')]
          print('Tokens:', len(tokens))
          if not tokens: exit()

          for ev in evs:
            corpo = ev.get('titulo','') + (' as ' + ev['horario'] if ev.get('horario') else '') + (' - ' + ev['local'] if ev.get('local') else '')
            r = messaging.send_each_for_multicast(messaging.MulticastMessage(tokens=tokens, notification=messaging.Notification(title='Evento amanha!', body=corpo)))
            print('OK:', r.success_count, 'Falha:', r.failure_count)
          PYEOF
