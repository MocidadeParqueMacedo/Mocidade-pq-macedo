nome: Notificações de Eventos

sobre:
  despacho de fluxo de trabalho:
  agendar:
    - cron: '0 11 * * *'

empregos:
  notificar:
    executa em: ubuntu-latest
    passos:
      - nome: oz
        execute: pip install pywebpush requests --quiet

      - nome: Script
        executar: |
          python3 - <<'EOF'
          importar os, json, solicitações
          from datetime import datetime, timedelta, timezone
          from pywebpush import webpush, WebPushException
          PRIVADO = os.environ["VAPID_PRIVATE_KEY"]
          RECLAMAÇÕES = {"sub": "mailto:rdj.parquemacedo@gmail.com"}
          DB = "https://mocidade-parque-macedo-default-rtdb.firebaseio.com"
          agora = datetime.now(timezone.utc) + timedelta(hours=-3)
          hoje = agora.strftime("%Y-%m-%d")
          amanha = (agora+timedelta(dias=1)).strftime("%Y-%m-%d")
          em7 = (agora+timedelta(dias=7)).strftime("%Y-%m-%d")
          hjmd = agora.strftime("%m-%d")
          ammd = (agora+timedelta(dias=1)).strftime("%m-%d")
          print("Amanha:", amanha)
          rd = requests.get(f"{DB}/dispositivos.json").json()
          se não rd: print("Sem dispositivos"); saída()
          ds = [d para d em (rd.values() se isinstance(rd,dict) senão rd) se d e d.get("endpoint") e d.get("p256dh")]
          print(f"{len(ds)} dispositivos")
          se não ds: sair()
          mortos = []
          def push(título, corpo, tag):
            pl = json.dumps({"title":titulo,"body":corpo,"tag":tag})
            para d em ds:
              tentar:
                webpush(subscription_info={"endpoint":d["endpoint"],"keys":{"p256dh":d.get("p256dh",""),"auth":d.get("auth","")}},data=pl,vapid_private_key=PRIVATE,vapid_claims=CLAIMS)
                imprimir(" OK")
              exceto WebPushException como ex:
                msg=str(ex)
                se algum(c em msg para c em ["410","404","403"]): mortos.append(d["endpoint"])
                senão: print("Falha:",msg[:40])
          re_ = requests.get(f"{DB}/app/events.json").json()
          se re_:
            para ev em (re_.values() se isinstance(re_,dict) senão re_):
              se não ev: continue
              c=ev.get("titulo","")+(" as "+ev["horario"] if ev.get("horario") else "")+(" - "+ev["local"] if ev.get("local") else "")
              if ev.get("dados")==amanha: push("Evento amanha!",c,f"ev-{ev.get('id',0)}-1d")
              elif ev.get("dados")==em7: push("Evento em 1 semana!",c,f"ev-{ev.get('id',0)}-7d")
          rv = requests.get(f"{DB}/app/visitas.json").json()
          se rv:
            para v em (rv.values() se isinstance(rv,dict) senão rv):
              se v e v.get("data")==amanha:
                push("Visita Amanha!",f"Casa de {v.get('nome','')}",f"vis-{v.get('id','')}")
          rm = requests.get(f"{DB}/app/members.json").json()
          se rm:
            para m em (rm.values() se isinstance(rm,dict) senão rm):
              se não m ou não m.get("nascimento"): continue
              n=m["nascimento"]; partes=n.split("-") se "-" em n senão n.split("/")
              tentar:
                nmd=f"{parts[1]}-{parts[2]}" se "-" em n senão f"{parts[1]}-{parts[0]}"
                ano=int(parts[0]) se "-" em n senão int(parts[2])
              exceto: continuar
              nome=m.get("nome","").split()[0]; idade=agora.ano-ano
              if nmd==ammd: push("Aniversario amanha!",f"Amanha {nome} completa {idade} anos!",f"an-{m.get('id','')}-am")
              elif nmd==hjmd: push("Feliz Aniversário!",f"Hoje {nome} completo {idade} anos!",f"an-{m.get('id','')}-hj")
          se mortos:
            r3=requests.get(f"{DB}/dispositivos.json").json() ou {}
            para k,v em (r3.items() se isinstance(r3,dict) senão []):
              se v e v.get("endpoint") em mortos:
                requests.delete(f"{DB}/dispositivos/{k}.json"); print("Removido:",k[:15])
          print("Concluído!")
          Fim do jogo
        ambiente:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}    
