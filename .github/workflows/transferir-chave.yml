name: Transferir chave de notificacoes (uso unico)

on:
  workflow_dispatch:

jobs:
  transferir:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar chave VAPID para o Supabase
        env:
          V: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request
          req = urllib.request.Request(
              "https://ofephqwjlxvemkohcmcu.supabase.co/rest/v1/rpc/salvar_vapid_privada",
              data=json.dumps({"v": os.environ["V"].strip()}).encode(),
              headers={"apikey": "sb_publishable_JS5fjrUZsR5zV6d1fNIZfQ_fr3h6vxz", "Content-Type": "application/json"},
          )
          print("gravada:", urllib.request.urlopen(req).read().decode())
          EOF